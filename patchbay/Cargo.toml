[package]
name = "patchbay"
version = "0.5.0"
description = "Linux network-namespace lab for NAT, routing, and link-impairment experiments"
keywords = ["network", "namespace", "nat", "simulation", "testing"]
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
iroh-metrics = ["dep:iroh-metrics"]

[dependencies]
iroh-metrics = { version = "0.38", optional = true }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
derive_more = { version = "2.1.1", features = ["debug", "display"] }
futures = "0.3"
ipnet = { version = "2.11", features = ["serde"] }
libc = "0.2"
nix = { version = "0.30", features = ["sched", "mount", "fs", "signal", "process", "user", "ioctl"] }
rtnetlink = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strum = { version = "0.28", features = ["derive"] }
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "fs", "net", "io-util", "process"] }
hickory-proto = { version = "0.25", default-features = false }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "1.0"
tracing = "0.1"
tracing-core = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "ansi"] }

[dev-dependencies]
ctor = "0.6"
futures-buffered = "0.2"
hickory-resolver = { version = "0.25", default-features = false, features = ["system-config", "tokio"] }
n0-tracing-test = "0.3.0"
portmapper = { version = "0.16", default-features = false }
testdir = "0.9"
