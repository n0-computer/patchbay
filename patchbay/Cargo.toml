[package]
name = "patchbay"
version = "0.7.1"
description = "Linux network-namespace lab for NAT, routing, and link-impairment experiments"
keywords = ["network", "namespace", "nat", "simulation", "testing"]
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = ["dns-server"]
# The in-process lab DNS server (`Lab::dns_server`).
dns-server = ["dep:hickory-proto"]
iroh-metrics = ["dep:iroh-metrics"]

[dependencies]
iroh-metrics = { version = "1.0.2", optional = true }
anyhow = "1"
derive_more = { version = "2.1.1", features = ["debug", "display", "eq"] }
futures-lite = "2.6"
ipnet = { version = "2.12", features = ["serde"] }
libc = "0.2"
netlink-packet-core = "0.9"
netlink-packet-route = "0.33"
netlink-proto = "0.13"
rustix = { version = "1.1", default-features = false, features = ["std", "thread", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strum = { version = "0.28", features = ["derive"] }
time = { version = "0.3", features = ["formatting", "local-offset", "macros", "parsing", "serde"] }
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "fs", "net", "io-util", "process"] }
hickory-proto = { version = "0.26", default-features = false, optional = true }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "1.1"
tracing = "0.1"
tracing-core = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "ansi"] }

[dev-dependencies]
ctor = "1.0"
futures-buffered = "0.2"
hickory-resolver = { version = "0.26", default-features = false, features = ["system-config", "tokio"] }
n0-tracing-test = "0.3.0"
noq-udp = "1.5"
testdir = "0.10"
