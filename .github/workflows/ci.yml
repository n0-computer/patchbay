name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: sccache

# Default to read-only; jobs that need more grant it explicitly.
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: taiki-e/install-action@76c2e6406e52637deed7160d77bded76bd83e06e # v2.87.14
        with:
          tool: cargo-make
      - uses: taiki-e/install-action@76c2e6406e52637deed7160d77bded76bd83e06e # v2.87.14
        with:
          tool: nextest

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Install iperf3
        run: sudo apt-get update && sudo apt-get install -y iperf3

      - name: Enable unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Build
        run: cargo build --locked --workspace --all-targets

      - name: Test
        run: cargo nextest run --locked --workspace --profile ci

      - name: Clippy
        run: cargo clippy --locked --workspace --tests -- -D warnings

      - name: Format
        run: cargo make format-check
      - name: Lockfile must not have moved
        # cargo make takes no --locked; assert the lockfile instead.
        run: git diff --exit-code Cargo.lock

  macos-check:
    runs-on: [self-hosted, macOS, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
          components: clippy

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Build patchbay-vm
        run: cargo build --locked -p patchbay-vm

      - name: Clippy patchbay-vm
        run: cargo clippy --locked -p patchbay-vm -- -D warnings

      - name: Container backend smoke test
        run: |
          if ! command -v container >/dev/null 2>&1; then
            echo "container CLI not found, skipping smoke test"
            exit 0
          fi
          if ! command -v aarch64-linux-musl-gcc >/dev/null 2>&1; then
            echo "musl cross-compiler not found, skipping smoke test"
            echo "install with: brew install filosottile/musl-cross/musl-cross"
            exit 0
          fi
          rustup target add aarch64-unknown-linux-musl
          cargo build --locked --release -p patchbay-vm -p patchbay-runner --bin patchbay --target aarch64-unknown-linux-musl
          ./target/release/patchbay-vm --backend container run \
            --patchbay-version "path:target/aarch64-unknown-linux-musl/release/patchbay" \
            ./patchbay-cli/tests/fixtures/iperf-1to1-public.toml
          ./target/release/patchbay-vm --backend container down

  e2e:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Build UI bundle
        working-directory: ui
        run: npm run build

      - name: Install Playwright browser and system deps
        working-directory: ui
        run: npx playwright install --with-deps chromium

      - name: Install iperf3
        run: sudo apt-get update && sudo apt-get install -y iperf3

      - name: Enable unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Build Rust (bins + test targets)
        run: cargo build --locked --workspace --all-targets

      - name: UI E2E
        working-directory: ui
        run: npm run test:e2e


  cargo_deny:
    timeout-minutes: 30
    name: cargo deny
    runs-on: ubuntu-latest
    # cargo-deny-action runs in a Docker container that does not have sccache
    # installed, so override the workflow-wide RUSTC_WRAPPER env var.
    env:
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          arguments: --workspace --all-features
          command: check
          command-arguments: "-Dwarnings"
